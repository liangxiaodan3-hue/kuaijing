<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="快鲸">
<meta name="theme-color" content="#0d1117">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>快鲸</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<div id="app">
  <div id="mainView">
    <div id="tabBar">
      <button class="tab active" data-mode="0">漫画</button>
      <button class="tab" data-mode="1">视频</button>
      <button class="tab" data-mode="2">社区</button>
      <button class="tab" data-mode="3">小说</button>
      <button class="tab" data-mode="5">短剧</button>
      <button class="tab" data-mode="4">历史</button>
    </div>
    <div id="toolbar">
      <div id="searchRow">
        <input id="searchInput" type="text" placeholder="搜索..." autocomplete="off">
        <button id="searchBtn">搜索</button>
        <button id="catBtn">分类 ▾</button>
      </div>
      <div id="catPanel" class="hidden">
        <div id="catClassRow" class="catRow"><label>分类</label><div class="chips" id="catClassChips"></div></div>
        <div id="catTagRow" class="catRow"><label>标签</label><div class="chips" id="catTagChips"></div></div>
        <div id="catChildRow" class="catRow"><label>子类</label><div class="chips" id="catChildChips"></div></div>
      </div>
      <div id="hotRow"><span id="hotLabel">热门:</span><div id="hotChips"></div></div>
    </div>
    <div id="grid"></div>
    <div id="loadMore" class="hidden">加载中...</div>
  </div>
  <div id="readerView" class="hidden">
    <div id="readerHeader">
      <button id="readerBack">←</button>
      <span id="readerTitle"></span>
      <span id="readerBadge"></span>
      <button id="readerRotate">旋转</button>
      <button id="readerCatalog">目录</button>
    </div>
    <div id="readerList"></div>
    <div id="chapterPanel" class="hidden">
      <div id="chapterPanelHeader">
        <span>章节目录</span>
        <button id="chapterPanelClose">×</button>
      </div>
      <div id="chapterList"></div>
    </div>
  </div>
  <div id="playerView" class="hidden">
    <div id="playerHeader">
      <button id="playerBack">←</button>
      <span id="playerTitle"></span>
    </div>
    <div id="playerBody">
      <video id="videoEl" controls playsinline webkit-playsinline preload="metadata"></video>
      <div id="playerStatus"></div>
      <div id="playerNav" class="hidden">
        <button id="plPrev" class="plNavBtn">‹ 上一集</button>
        <button id="plList" class="plNavBtn plListBtn">选集</button>
        <button id="plNext" class="plNavBtn">下一集 ›</button>
      </div>
      <div id="playerEpPanel" class="hidden">
        <div id="playerEpHead"><span id="playerEpTitle">选集</span><button id="playerEpClose">×</button></div>
        <div id="playerEpList"></div>
      </div>
    </div>
  </div>
  <div id="forumView" class="hidden">
    <div id="forumHeader">
      <button id="forumBack">←</button>
      <span id="forumTitle">帖子</span>
    </div>
    <div id="forumBody"></div>
  </div>
  <div id="novelView" class="hidden">
    <div id="novelHeader">
      <button id="novelBack">←</button>
      <span id="novelTitle"></span>
      <button id="novelCatalog">目录</button>
    </div>
    <div id="novelBody"></div>
    <div id="novelChapterPanel" class="hidden">
      <div id="novelChapterPanelHeader">
        <span>章节目录</span>
        <button id="novelChapterPanelClose">×</button>
      </div>
      <div id="novelChapterList"></div>
    </div>
  </div>
  <div id="externalView" class="hidden">
    <div id="extHeader">
      <button id="extBack">←</button>
      <span id="extTitle">外部资源</span>
      <span id="extHint">需翻墙</span>
    </div>
    <div id="extSegBar">
      <button class="extSeg active" data-seg="0">短剧</button>
      <button class="extSeg" data-seg="1">视频</button>
      <button class="extSeg" data-seg="2">小说</button>
    </div>
    <div id="extSearchRow">
      <input id="extSearchInput" type="text" placeholder="搜片名/关键词，回车或点搜索" autocomplete="off"><button id="extSearchBtn">搜索</button>
    </div>
    <div id="extCatRow" class="extChips"></div>
    <div id="extHotRow" class="extChips hidden"></div>
    <div id="extStatus" class="hidden"></div>
    <div id="extBody"></div>
  </div>
  <div id="toast" class="hidden"></div>
</div>
<script src="app.js?v=18"></script>
</body>
</html>
